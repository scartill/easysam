AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SqstriggerLambda
Parameters:
  Stage:
    Type: String
    Default: dev
Globals:
  Function:
    Runtime: python3.13
    Handler: index.handler
    Architectures:
      - x86_64
    Timeout: 30
    Environment:
      Variables:
        ENV: !Ref Stage
        EASYSAM_ENVIRONMENT: !Ref Stage
        ACCOUNT_ID: !Ref AWS::AccountId
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'*'"
      AllowMethods: "'*'"
      AllowCredentials: False
Resources:
    # end paths
  # Streams
    # end streams 
  # Tables
    # end tables
  # Queues
  GatewaySQSRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
              - apigateway.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
      - PolicyName: AllowSqsIntegration
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - 'sqs:SendMessage'
                - 'sqs:GetQueueUrl'
                - 'sqs:SendMessageBatch'
              Resource: '*'
      - PolicyName: AuthorizerPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: 
                - !GetAtt testauthorizerFunction.Arn
    # end queues
  # Streams
    # end streams
  # Buckets
    # end buckets
  # Queues
  sqstriggerlambdatestqueueQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "sqstriggerlambda-testqueue-${Stage}"
    # end queues
  # Tables
    # end tables
  # Lambda Layer
    # end lambda layer
  # Functions
  testauthlambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "testauthlambda-${Stage}"
      CodeUri: backend/function/authorizers
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*
        - SSMParameterReadPolicy:
            ParameterName: "*"
      Environment:
        Variables:
          REGION: !Ref AWS::Region
  testtriggerlambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "testtriggerlambda-${Stage}"
      CodeUri: backend/function/myfunction
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*
        - SSMParameterReadPolicy:
            ParameterName: "*"
        - SQSPollerPolicy:
            QueueName: !GetAtt sqstriggerlambdatestqueueQueue.QueueName
      Environment:
        Variables:
          REGION: !Ref AWS::Region
      Events:
        testqueueSQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt sqstriggerlambdatestqueueQueue.Arn
            Enabled: false
    # end functions
  # DynamoDB Stream Event Source Mappings (from table definitions)
    # end stream event source mappings
  # Search
    # end search
  # MQTT (IoT Core)
    # end mqtt